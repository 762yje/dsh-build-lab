name: site-check

# Daily availability + latency check of the public blog. No secrets, no personal data.

on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to check'
        required: false
        default: 'https://762yje.github.io/blog/'

permissions:
  contents: read

concurrency:
  group: site-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        shell: bash
        env:
          TARGET: ${{ inputs.url || 'https://762yje.github.io/blog/' }}
        run: |
          set -uo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$TARGET")
          secs=$(curl -sS -o /dev/null -w '%{time_total}' --max-time 30 "$TARGET")
          echo "SITE $TARGET status=$code time=${secs}s"
          {
            echo "### site-check"
            echo "- url: $TARGET"
            echo "- status: $code"
            echo "- time_total: ${secs}s"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != "200" ]; then echo "RESULT=FAIL"; exit 1; fi
          echo "RESULT=OK"

name: secret-guard

# Public-repo guard. Blocks credentials, proxy nodes and personal data.
# Reusable: other public repos may call it with
#   uses: 762yje/dsh-build-lab/.github/workflows/secret-guard.yml@main

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'   # daily 03:17 UTC, well away from the top of the hour
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: secret-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run secret/PII scan
        shell: bash
        run: |
          set -uo pipefail
          bash guard/scan-secrets.sh
        # exit 1 prints RESULT=VIOLATION and fails the job on purpose

      - name: Self-check on canonical rules
        shell: bash
        run: |
          set -euo pipefail
          # prove the scanner still detects a planted fake credential without echoing it
          fake="ghp_$(printf 'A%.0s' {1..30})"
          printf 'token=%s\n' "$fake" > /tmp/planted.txt
          if bash guard/scan-secrets.sh --path /tmp/planted.txt; then
            echo "SELFTEST=FAIL scanner did not flag a planted token"
            exit 1
          fi
          echo "SELFTEST=PASS scanner flagged the planted token"
          bash guard/scan-secrets.sh --worktree
